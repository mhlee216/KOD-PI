[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kodpi"
version = "1.0.0"
description = "Korean benchmark for over-defense in prompt injection detection: dataset and detector evaluation"
requires-python = ">=3.11"
dependencies = [
    "torch==2.7.1",
    "transformers==4.51.3",
    "numpy>=1.26",
    "matplotlib==3.9.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kodpi = "kodpi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kodpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*", "ignore::DeprecationWarning:pyparsing.*"]
